name: Code Quality

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"
      
      - name: Install linting tools
        run: |
          pip install flake8 black isort mypy
      
      - name: Run black format check
        run: |
          cd backend
          black --check app tests --line-length=100 2>/dev/null || true
        continue-on-error: true
      
      - name: Run isort import check
        run: |
          cd backend
          isort --check-only app tests 2>/dev/null || true
        continue-on-error: true
      
      - name: Run flake8 linter
        run: |
          cd backend
          flake8 app tests --count --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true
      
      - name: Type check with mypy
        run: |
          cd backend
          mypy app --ignore-missing-imports --no-error-summary 2>/dev/null || true
        continue-on-error: true
      
      - name: Summary
        run: echo "✅ Code quality checks completed"
