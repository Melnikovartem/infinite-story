name: Test Suite

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt 2>/dev/null || echo "No requirements-dev.txt found"
      
      - name: Lint with flake8
        run: |
          cd backend
          pip install flake8
          flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true
      
      - name: Format check with black
        run: |
          cd backend
          pip install black
          black --check app tests --line-length=100 2>/dev/null || echo "Some files need formatting"
        continue-on-error: true
      
      - name: Run tests with pytest
        run: |
          cd backend
          pip install pytest-cov pytest-benchmark pytest-asyncio
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing --tb=short
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage.xml
          fail_ci_if_error: false
        continue-on-error: true
      
      - name: Type check with mypy
        run: |
          cd backend
          pip install mypy
          mypy app --ignore-missing-imports --no-error-summary 2>/dev/null || true
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"
      
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || echo "No requirements.txt"
      
      - name: Run basic import checks
        run: |
          cd backend
          python -c "from app.models.story import Story; print('✓ Story model imports successfully')"
          python -c "from app.engine.generator import TextGenerator; print('✓ Generator imports successfully')"
      
      - name: Build summary
        run: echo "✅ Build checks passed successfully"
